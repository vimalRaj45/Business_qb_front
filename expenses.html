<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses - Business Billing Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-50 min-h-screen flex text-slate-900">

  <aside id="sidebar-container" class="w-64 fixed inset-y-0 z-30 hidden md:block"></aside>

  <div class="flex-1 md:pl-64 flex flex-col min-h-screen">
    <div id="header-container"></div>

    <main class="p-6 space-y-6 max-w-7xl w-full mx-auto pb-24 md:pb-6">
      
      <!-- Top Bar -->
      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-white p-4 rounded-2xl border border-slate-200 shadow-xs">
        <div>
          <h3 class="font-bold text-slate-900 text-sm">Business Expenses</h3>
          <p class="text-xs text-slate-500">Track all operational spending, vendor payments, and bills.</p>
        </div>

        <div class="flex items-center gap-1.5 sm:gap-2 w-full sm:w-auto justify-between sm:justify-end">
          <button id="export-exp-csv-btn" class="flex-1 sm:flex-none px-2.5 sm:px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-[10px] sm:text-xs flex items-center justify-center gap-1 transition whitespace-nowrap">
            <i class="bi bi-filetype-csv text-emerald-600 text-xs sm:text-sm"></i> Export CSV
          </button>
          <button id="export-exp-pdf-btn" class="flex-1 sm:flex-none px-2.5 sm:px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-[10px] sm:text-xs flex items-center justify-center gap-1 transition whitespace-nowrap">
            <i class="bi bi-file-earmark-pdf-fill text-rose-500 text-xs sm:text-sm"></i> Export PDF
          </button>
          <button onclick="window.openExpenseModal()" class="flex-1 sm:flex-none px-3 sm:px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-[10px] sm:text-xs flex items-center justify-center gap-1.5 shadow-xs transition whitespace-nowrap">
            <i class="bi bi-plus-circle-fill"></i> Add Expense
          </button>
        </div>
      </div>

      <!-- Expenses Table Card -->
      <div id="expenses-table-card" class="card-premium overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
              <tr>
                <th class="py-3.5 px-4">Date</th>
                <th class="py-3.5 px-4">Category</th>
                <th class="py-3.5 px-4">Description</th>
                <th class="py-3.5 px-4">Vendor</th>
                <th class="py-3.5 px-4">Payment Method</th>
                <th class="py-3.5 px-4 text-right">Amount</th>
              </tr>
            </thead>
            <tbody id="expenses-tbody">
              <tr><td colspan="6" class="py-8 text-center text-slate-400">Loading expenses...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <!-- Add Expense Modal -->
  <div id="expense-modal" class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <h3 class="font-bold text-slate-900 text-base">Record Business Expense</h3>
        <button onclick="window.closeExpenseModal()" class="text-slate-400 hover:text-slate-600 text-lg"><i class="bi bi-x-lg"></i></button>
      </div>

      <form id="expense-form" class="space-y-3 text-xs">
        <div class="space-y-1">
          <label class="font-bold text-slate-700">Category <span class="text-rose-500">*</span></label>
          <select name="category" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
            <option value="Office Supplies">Office Supplies</option>
            <option value="Software & Subscriptions">Software & Subscriptions</option>
            <option value="Rent & Utilities">Rent & Utilities</option>
            <option value="Salaries & Payroll">Salaries & Payroll</option>
            <option value="Marketing & Ads">Marketing & Ads</option>
            <option value="Travel & Meals">Travel & Meals</option>
            <option value="Vendor Payments">Vendor Payments</option>
            <option value="Other">Other Operational</option>
          </select>
        </div>

        <div class="space-y-1">
          <label class="font-bold text-slate-700">Expense Description <span class="text-rose-500">*</span></label>
          <input type="text" name="description" required placeholder="e.g. Google Cloud Monthly Hosting" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="font-bold text-slate-700">Amount <span class="text-rose-500">*</span></label>
            <input type="number" step="0.01" name="amount" required placeholder="0.00" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono font-bold" />
          </div>

          <div class="space-y-1">
            <label class="font-bold text-slate-700">Expense Date</label>
            <input type="date" name="expense_date" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs" />
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="space-y-1">
            <label class="font-bold text-slate-700">Vendor / Payee</label>
            <input type="text" name="vendor" placeholder="Vendor Name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs" />
          </div>

          <div class="space-y-1">
            <label class="font-bold text-slate-700">Payment Method</label>
            <select name="payment_method" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs">
              <option value="Corporate Credit Card">Credit Card</option>
              <option value="Bank Transfer">Bank Transfer</option>
              <option value="UPI">UPI</option>
              <option value="Cash">Cash</option>
            </select>
          </div>
        </div>

        <div class="pt-3 border-t border-slate-100 flex justify-end gap-2">
          <button type="button" onclick="window.closeExpenseModal()" class="px-4 py-2 bg-slate-100 text-slate-700 rounded-xl font-bold">Cancel</button>
          <button type="submit" class="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold shadow-xs">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { checkAuth } from '/js/auth.js';
    import { renderLayout } from '/js/layout.js';
    import { API } from '/js/api.js';
    import { formatCurrency, formatDate, showToast, exportToCSV, exportTableToPDF } from '/js/utils.js';

    let allExpenses = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await checkAuth();
      if (!auth) return;

      renderLayout(auth.business, auth.user);
      loadExpenses(auth.business.currency);

      document.getElementById('export-exp-csv-btn')?.addEventListener('click', () => {
        exportToCSV(allExpenses, 'expenses_log.csv');
      });
      document.getElementById('export-exp-pdf-btn')?.addEventListener('click', () => {
        exportTableToPDF('expenses-table-card', 'expenses_log.pdf');
      });
    });

    window.openExpenseModal = function() {
      const modal = document.getElementById('expense-modal');
      const form = document.getElementById('expense-form');
      if (form) form.reset();
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
    };

    window.closeExpenseModal = function() {
      const modal = document.getElementById('expense-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    };

    async function loadExpenses(currency) {
      try {
        const res = await API.get('/api/expenses');
        allExpenses = res.data || [];
        const tbody = document.getElementById('expenses-tbody');

        if (!allExpenses.length) {
          tbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">No expenses recorded yet. Click "Add New Expense" above.</td></tr>`;
          return;
        }

        tbody.innerHTML = allExpenses.map(e => `
          <tr class="border-b border-slate-100 hover:bg-slate-50/60">
            <td class="py-3 px-4 text-slate-600 font-semibold">${formatDate(e.expense_date)}</td>
            <td class="py-3 px-4"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">${e.category || 'General'}</span></td>
            <td class="py-3 px-4 font-bold text-slate-900">${e.description}</td>
            <td class="py-3 px-4 text-slate-600">${e.vendor || '-'}</td>
            <td class="py-3 px-4 text-slate-600">${e.payment_method || 'Other'}</td>
            <td class="py-3 px-4 text-right font-extrabold text-rose-600">${formatCurrency(e.amount, currency)}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Error loading expenses:', err);
      }
    }

    document.getElementById('expense-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const payload = Object.fromEntries(formData.entries());

      try {
        await API.post('/api/expenses', payload);
        showToast('Expense recorded successfully!', 'success');
        window.closeExpenseModal();
        location.reload();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
