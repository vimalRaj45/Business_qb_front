<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer View - Business Billing Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-50 min-h-screen flex text-slate-900">

  <aside id="sidebar-container" class="w-64 fixed inset-y-0 z-30 hidden md:block"></aside>

  <div class="flex-1 md:pl-64 flex flex-col min-h-screen">
    <div id="header-container"></div>

    <main class="p-6 space-y-6 max-w-7xl w-full mx-auto">
      
      <!-- Back Button -->
      <div>
        <a href="/customers.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900">
          <i class="bi bi-arrow-left"></i> Back to Customers
        </a>
      </div>

      <!-- Customer Detail Card -->
      <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-xs flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
          <h2 id="cust-name-title" class="text-2xl font-bold text-slate-900">Loading Customer...</h2>
          <div id="cust-company-sub" class="text-xs text-slate-500 font-medium mt-0.5">--</div>
          <div id="cust-contact-info" class="text-xs text-slate-600 mt-2 space-x-3"></div>
        </div>
        
        <div class="flex items-center gap-4">
          <div class="bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 text-right">
            <div class="text-[10px] uppercase font-bold text-slate-400">Total Billed</div>
            <div id="cust-total-billed" class="text-base font-extrabold text-slate-900">--</div>
          </div>
          <div class="bg-emerald-50 border border-emerald-100 rounded-xl px-4 py-3 text-right">
            <div class="text-[10px] uppercase font-bold text-emerald-600">Total Paid</div>
            <div id="cust-total-paid" class="text-base font-extrabold text-emerald-700">--</div>
          </div>
          <div class="bg-rose-50 border border-rose-100 rounded-xl px-4 py-3 text-right">
            <div class="text-[10px] uppercase font-bold text-rose-600">Outstanding Due</div>
            <div id="cust-outstanding" class="text-base font-extrabold text-rose-700">--</div>
          </div>
        </div>
      </div>

      <!-- Invoices & Quotations Tabbed View -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Invoices -->
        <div class="card-premium p-5 space-y-4">
          <h3 class="font-bold text-slate-900 text-sm border-b border-slate-100 pb-2">Customer Invoices</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead>
                <tr class="text-slate-400 font-semibold border-b border-slate-100">
                  <th class="py-2">Invoice #</th>
                  <th class="py-2">Date</th>
                  <th class="py-2">Status</th>
                  <th class="py-2 text-right">Total</th>
                </tr>
              </thead>
              <tbody id="cust-invoices-tbody">
                <tr><td colspan="4" class="py-4 text-center text-slate-400">Loading invoices...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <!-- Quotations -->
        <div class="card-premium p-5 space-y-4">
          <h3 class="font-bold text-slate-900 text-sm border-b border-slate-100 pb-2">Customer Quotations</h3>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead>
                <tr class="text-slate-400 font-semibold border-b border-slate-100">
                  <th class="py-2">Quotation #</th>
                  <th class="py-2">Date</th>
                  <th class="py-2">Status</th>
                  <th class="py-2 text-right">Total</th>
                </tr>
              </thead>
              <tbody id="cust-quotations-tbody">
                <tr><td colspan="4" class="py-4 text-center text-slate-400">Loading quotations...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script type="module">
    import { checkAuth } from '/js/auth.js';
    import { renderLayout } from '/js/layout.js';
    import { API } from '/js/api.js';
    import { formatCurrency, formatDate, getStatusBadge } from '/js/utils.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await checkAuth();
      if (!auth) return;

      renderLayout(auth.business, auth.user);
      
      const params = new URLSearchParams(window.location.search);
      const custId = params.get('id');
      if (custId) {
        loadCustomerDetail(custId, auth.business.currency);
      }
    });

    async function loadCustomerDetail(id, currency) {
      try {
        const res = await API.get(`/api/customers/${id}`);
        const c = res.data;
        if (!c) return;

        document.getElementById('cust-name-title').textContent = c.customer_name;
        document.getElementById('cust-company-sub').textContent = c.company_name || 'Individual Customer';
        document.getElementById('cust-contact-info').innerHTML = `
          <span><i class="bi bi-envelope"></i> ${c.email || 'N/A'}</span>
          <span><i class="bi bi-telephone"></i> ${c.phone || 'N/A'}</span>
          <span><i class="bi bi-geo-alt"></i> ${[c.address, c.city, c.country].filter(Boolean).join(', ') || 'N/A'}</span>
        `;

        document.getElementById('cust-total-billed').textContent = formatCurrency(c.summary.total_sales, currency);
        document.getElementById('cust-total-paid').textContent = formatCurrency(c.summary.total_paid, currency);
        document.getElementById('cust-outstanding').textContent = formatCurrency(c.summary.outstanding, currency);

        // Render Invoices Table
        const invTbody = document.getElementById('cust-invoices-tbody');
        if (!c.invoices.length) {
          invTbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">No invoices for this customer yet.</td></tr>`;
        } else {
          invTbody.innerHTML = c.invoices.map(i => `
            <tr class="border-b border-slate-50 hover:bg-slate-50/50">
              <td class="py-2.5 font-bold"><a href="/invoice-view.html?id=${i.invoice_id}" class="text-teal-600 hover:underline">${i.invoice_number}</a></td>
              <td class="py-2.5 text-slate-600">${formatDate(i.invoice_date)}</td>
              <td class="py-2.5">${getStatusBadge(i.status)}</td>
              <td class="py-2.5 text-right font-semibold">${formatCurrency(i.total, currency)}</td>
            </tr>
          `).join('');
        }

        // Render Quotations Table
        const quoTbody = document.getElementById('cust-quotations-tbody');
        if (!c.quotations.length) {
          quoTbody.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-400">No quotations for this customer yet.</td></tr>`;
        } else {
          quoTbody.innerHTML = c.quotations.map(q => `
            <tr class="border-b border-slate-50 hover:bg-slate-50/50">
              <td class="py-2.5 font-bold"><a href="/quotation-view.html?id=${q.quotation_id}" class="text-teal-600 hover:underline">${q.quotation_number}</a></td>
              <td class="py-2.5 text-slate-600">${formatDate(q.quotation_date)}</td>
              <td class="py-2.5">${getStatusBadge(q.status)}</td>
              <td class="py-2.5 text-right font-semibold">${formatCurrency(q.total, currency)}</td>
            </tr>
          `).join('');
        }

      } catch (err) {
        console.error(err);
      }
    }
  </script>
</body>
</html>
