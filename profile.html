<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Business Profile - Business Billing Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-50 min-h-screen flex text-slate-900">

  <aside id="sidebar-container" class="w-64 fixed inset-y-0 z-30 hidden md:block"></aside>

  <div class="flex-1 md:pl-64 flex flex-col min-h-screen">
    <div id="header-container"></div>

    <main class="p-6 space-y-6 max-w-4xl w-full mx-auto">
      
      <!-- Sub Nav -->
      <div class="flex items-center gap-2 border-b border-slate-200 pb-3">
        <a href="/settings.html" class="px-3.5 py-2 bg-white text-slate-700 hover:bg-slate-100 rounded-xl text-xs font-semibold border border-slate-200">Data & Privacy</a>
        <a href="/profile.html" class="px-3.5 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">Business Profile</a>
      </div>

      <!-- Business Profile Form Card -->
      <div class="card-premium p-8 space-y-6">
        <div>
          <h2 class="text-xl font-bold text-slate-900">Business Profile Settings</h2>
          <p class="text-xs text-slate-500 mt-1">This information appears on your printed invoices and quotations.</p>
        </div>

        <form id="profile-form" class="space-y-4 text-left">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Business Name *</label>
              <input type="text" id="prof_name" required class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Business Type</label>
              <input type="text" id="prof_type" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs" />
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Phone Number</label>
              <input type="text" id="prof_phone" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Tax / GST Number</label>
              <input type="text" id="prof_tax" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs" />
            </div>
          </div>

          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Address</label>
            <input type="text" id="prof_address" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs mb-2" />
            <div class="grid grid-cols-3 gap-2">
              <input type="text" id="prof_city" class="border border-slate-200 rounded-xl px-3 py-2 text-xs" placeholder="City" />
              <input type="text" id="prof_state" class="border border-slate-200 rounded-xl px-3 py-2 text-xs" placeholder="State" />
              <input type="text" id="prof_country" class="border border-slate-200 rounded-xl px-3 py-2 text-xs" placeholder="Country" />
            </div>
          </div>

          <div class="grid grid-cols-3 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Currency</label>
              <select id="prof_currency" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs">
                <option value="USD $">USD ($)</option>
                <option value="EUR €">EUR (€)</option>
                <option value="GBP £">GBP (£)</option>
                <option value="INR ₹">INR (₹)</option>
                <option value="CAD $">CAD ($)</option>
                <option value="AUD $">AUD ($)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Invoice Prefix</label>
              <input type="text" id="prof_inv_prefix" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Quotation Prefix</label>
              <input type="text" id="prof_quo_prefix" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs" />
            </div>
          </div>

          <div class="pt-4 flex justify-end border-t border-slate-100">
            <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs shadow-md">
              Save Profile Changes
            </button>
          </div>
        </form>
      </div>

    </main>
  </div>

  <script type="module">
    import { checkAuth } from '/js/auth.js';
    import { renderLayout } from '/js/layout.js';
    import { API } from '/js/api.js';
    import { showToast } from '/js/utils.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await checkAuth();
      if (!auth) return;

      renderLayout(auth.business, auth.user);
      
      const b = auth.business || {};
      document.getElementById('prof_name').value = b.business_name || '';
      document.getElementById('prof_type').value = b.business_type || '';
      document.getElementById('prof_phone').value = b.phone || '';
      document.getElementById('prof_tax').value = b.tax_number || '';
      document.getElementById('prof_address').value = b.address || '';
      document.getElementById('prof_city').value = b.city || '';
      document.getElementById('prof_state').value = b.state || '';
      document.getElementById('prof_country').value = b.country || '';
      document.getElementById('prof_currency').value = b.currency || 'USD $';
      document.getElementById('prof_inv_prefix').value = b.invoice_prefix || 'INV-';
      document.getElementById('prof_quo_prefix').value = b.quotation_prefix || 'QUO-';

      document.getElementById('profile-form').addEventListener('submit', handleProfileSubmit);
    });

    async function handleProfileSubmit(e) {
      e.preventDefault();
      const payload = {
        business_name: document.getElementById('prof_name').value,
        business_type: document.getElementById('prof_type').value,
        phone: document.getElementById('prof_phone').value,
        tax_number: document.getElementById('prof_tax').value,
        address: document.getElementById('prof_address').value,
        city: document.getElementById('prof_city').value,
        state: document.getElementById('prof_state').value,
        country: document.getElementById('prof_country').value,
        currency: document.getElementById('prof_currency').value,
        invoice_prefix: document.getElementById('prof_inv_prefix').value,
        quotation_prefix: document.getElementById('prof_quo_prefix').value
      };

      try {
        await API.put('/api/business', payload);
        showToast('Business profile updated!', 'success');
        setTimeout(() => location.reload(), 600);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
