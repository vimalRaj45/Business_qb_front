<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticating... - Bizsheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-slate-900">

  <div id="app-splash-screen" class="no-print">
    <div class="splash-glass-card space-y-4 text-center">
      <div class="w-16 h-16 rounded-2xl bg-teal-600 text-white flex items-center justify-center text-3xl font-black mx-auto shadow-lg splash-logo-pulse">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <div class="space-y-1">
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">Bizsheet Platform</h2>
        <p id="status-text" class="text-xs font-bold text-teal-700">Verifying Google Account Authorization...</p>
      </div>
      <div class="splash-progress-track">
        <div class="splash-progress-fill"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { API } from '/js/api.js';
    import { showToast } from '/js/utils.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');
      const statusText = document.getElementById('status-text');

      if (error) {
        showToast(`Google OAuth error: ${error}`, 'error');
        setTimeout(() => {
          window.location.href = `/login.html?error=${encodeURIComponent(error)}`;
        }, 1200);
        return;
      }

      if (!code) {
        showToast('Missing authorization code', 'error');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1200);
        return;
      }

      try {
        statusText.textContent = 'Exchanging OAuth token & connecting business ledger...';

        const inviteBiz = urlParams.get('invite_biz') || sessionStorage.getItem('invite_biz') || '';
        const redirectUri = window.location.origin + '/auth-callback.html';

        const res = await API.post('/api/auth/google/exchange', {
          code,
          redirect_uri: redirectUri,
          invite_biz: inviteBiz
        });

        if (res.success) {
          if (res.sessionToken) {
            localStorage.setItem('session_token', res.sessionToken);
          }
          sessionStorage.removeItem('invite_biz');
          showToast('Google login successful!', 'success');
          setTimeout(() => {
            const isCompleted = res.onboarding_completed === true || 
                                res.onboarding_completed === 'true' || 
                                res.business?.onboarding_completed === true || 
                                res.business?.onboarding_completed === 'true' || 
                                (Boolean(res.business?.business_name) && 
                                 !res.business.business_name.endsWith("'s Business"));
            if (isCompleted) {
              window.location.href = '/dashboard.html';
            } else {
              window.location.href = '/onboarding.html';
            }
          }, 400);
        } else {
          throw new Error(res.error?.message || 'Authentication failed');
        }
      } catch (err) {
        console.error('OAuth Exchange failure:', err);
        const errorMsg = err.message || 'Login failed';
        showToast(errorMsg, 'error');
        setTimeout(() => {
          window.location.href = `/login.html?error=${encodeURIComponent(errorMsg)}`;
        }, 1200);
      }
    });
  </script>
</body>
</html>
