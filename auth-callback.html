<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Authenticating... - Business Billing Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 text-slate-900">

  <div id="app-splash-screen" class="no-print">
    <div class="splash-glass-card space-y-4 text-center">
      <div class="w-16 h-16 rounded-2xl bg-teal-600 text-white flex items-center justify-center text-3xl font-black mx-auto shadow-lg splash-logo-pulse">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <div class="space-y-1">
        <h2 class="text-2xl font-black text-slate-900 tracking-tight">BizSheet Platform</h2>
        <p id="status-text" class="text-xs font-bold text-teal-700">Verifying Google Account Authorization...</p>
      </div>
      <div class="splash-progress-track">
        <div class="splash-progress-fill"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { API } from '/js/api.js';
    import { showToast } from '/js/utils.js';

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');
      const statusText = document.getElementById('status-text');

      if (error) {
        showToast(`Google OAuth error: ${error}`, 'error');
        setTimeout(() => {
          window.location.href = `/login.html?error=${encodeURIComponent(error)}`;
        }, 1200);
        return;
      }

      if (!code) {
        showToast('Missing authorization code', 'error');
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1200);
        return;
      }

      try {
        statusText.textContent = 'Exchanging OAuth token & building Google Drive ledger...';

        const redirectUri = window.location.origin + '/auth-callback.html';
        const res = await API.post('/api/auth/google/exchange', {
          code,
          redirect_uri: redirectUri
        });

        if (res.success) {
          showToast('Google login successful!', 'success');
          setTimeout(() => {
            if (res.onboarding_completed) {
              window.location.href = '/dashboard.html';
            } else {
              window.location.href = '/onboarding.html';
            }
          }, 400);
        } else {
          throw new Error(res.error?.message || 'Authentication failed');
        }
      } catch (err) {
        console.error('OAuth Exchange failure:', err);
        showToast(err.message || 'Login failed', 'error');
        setTimeout(() => {
          window.location.href = `/login.html?error=${encodeURIComponent(err.message)}`;
        }, 1200);
      }
    });
  </script>
</body>
</html>
