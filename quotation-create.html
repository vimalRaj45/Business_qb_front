<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Quotation - Business Billing Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-slate-50 min-h-screen flex text-slate-900">

  <aside id="sidebar-container" class="w-64 fixed inset-y-0 z-30 hidden md:block"></aside>

  <div class="flex-1 md:pl-64 flex flex-col min-h-screen">
    <div id="header-container"></div>

    <main class="p-4 md:p-6 space-y-6 max-w-5xl w-full mx-auto pb-28 md:pb-8">
      
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <a href="/quotations.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900">
          <i class="bi bi-arrow-left"></i> Cancel & Back
        </a>
        <h2 class="text-lg md:text-xl font-bold text-slate-900">New Price Estimate / Quotation</h2>
        <button type="submit" form="quotation-form" class="px-4 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs shadow-md flex items-center gap-1.5 active:scale-95 transition">
          <i class="bi bi-check-circle-fill"></i> Save & Generate
        </button>
      </div>

      <form id="quotation-form" class="space-y-6">
        
        <!-- Header Info Card -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-semibold text-slate-600">Customer <span class="text-rose-500">*</span></label>
                <button type="button" id="quick-add-customer-btn" class="text-xs font-bold text-teal-600 hover:text-teal-700 flex items-center gap-1 transition cursor-pointer">
                  <i class="bi bi-person-plus-fill"></i> + New Customer
                </button>
              </div>
              <select id="customer_id" required class="w-full border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold focus:outline-none focus:border-teal-500">
                <option value="">Select Customer...</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Quotation Date</label>
              <input type="date" id="quotation_date" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:outline-none" />
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Valid Until</label>
              <input type="date" id="valid_until" class="w-full border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:outline-none" />
            </div>
          </div>
        </div>

        <!-- Line Items Card -->
        <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <h3 class="font-bold text-slate-900 text-sm">Quotation Items</h3>
            <div class="flex items-center gap-2">
              <button type="button" id="quick-add-product-btn" class="px-3 py-1.5 bg-teal-50 text-teal-700 hover:bg-teal-100 rounded-lg text-xs font-semibold flex items-center gap-1 transition cursor-pointer">
                <i class="bi bi-box-seam-fill"></i> + New Product
              </button>
              <button type="button" id="add-item-btn" class="px-3 py-1.5 bg-teal-50 text-teal-700 hover:bg-teal-100 rounded-lg text-xs font-semibold flex items-center gap-1">
                <i class="bi bi-plus"></i> Add Line Item
              </button>
            </div>
          </div>

          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead>
                <tr class="text-slate-400 font-semibold border-b border-slate-100">
                  <th class="py-2 w-1/3">Item / Description</th>
                  <th class="py-2 w-20 text-center">Qty</th>
                  <th class="py-2 w-28 text-right">Unit Price</th>
                  <th class="py-2 w-24 text-right">Tax (%)</th>
                  <th class="py-2 w-28 text-right">Amount</th>
                  <th class="py-2 w-10 text-center"></th>
                </tr>
              </thead>
              <tbody id="items-tbody">
                <!-- Dynamic Items Inserted via JS -->
              </tbody>
            </table>
          </div>
        </div>

        <!-- Calculation Summary & Terms -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Notes to Customer</label>
              <textarea id="notes" rows="2" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs" placeholder="Thank you for your business!"></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Terms & Conditions</label>
              <textarea id="terms" rows="2" class="w-full border border-slate-200 rounded-xl p-2.5 text-xs" placeholder="Quotation valid for 30 days. 50% deposit required upon acceptance."></textarea>
            </div>
          </div>

          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-xs space-y-3">
            <div class="flex justify-between text-xs text-slate-600"><span class="font-medium">Subtotal:</span> <span id="calc-subtotal" class="font-bold text-slate-900">$0.00</span></div>
            <div class="flex justify-between text-xs text-slate-600"><span class="font-medium">Total Tax:</span> <span id="calc-tax" class="font-bold text-slate-900">$0.00</span></div>
            <div class="flex items-center justify-between text-xs text-slate-600">
              <span class="font-medium">Overall Discount:</span>
              <input type="number" step="0.01" id="overall-discount" value="0" class="w-24 border border-slate-200 rounded-lg px-2 py-1 text-right text-xs font-bold" />
            </div>
            <div class="border-t border-slate-200 pt-3 flex justify-between text-base font-extrabold text-slate-900">
              <span>Grand Total:</span>
              <span id="calc-total" class="text-teal-600">$0.00</span>
            </div>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-slate-200">
          <a href="/quotations.html" class="px-5 py-2.5 bg-slate-200 text-slate-700 font-semibold rounded-xl text-xs">Cancel</a>
          <button type="submit" class="px-6 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-extrabold rounded-xl text-xs shadow-md flex items-center gap-1.5 active:scale-95 transition">
            <i class="bi bi-check-circle-fill"></i> Save & Generate Quotation
          </button>
        </div>

      </form>

      <!-- Quick Add Customer Modal -->
      <div id="quick-customer-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-200">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-xl bg-teal-50 text-teal-700 flex items-center justify-center font-bold">
                <i class="bi bi-person-plus-fill"></i>
              </div>
              <h3 class="font-extrabold text-slate-900 text-sm">Quick Add Customer</h3>
            </div>
            <button type="button" id="close-quick-cust-btn" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-xs">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <form id="quick-customer-form" class="space-y-3 text-xs">
            <div>
              <label class="block font-bold text-slate-700 mb-1">Customer / Client Name <span class="text-rose-500">*</span></label>
              <input type="text" id="qc-name" required placeholder="e.g. Ramesh Kumar or Acme Corp" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-teal-500" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Company Name</label>
                <input type="text" id="qc-company" placeholder="Acme Ltd" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Phone Number</label>
                <input type="tel" id="qc-phone" placeholder="+91 98765 43210" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none" />
              </div>
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">Email Address</label>
              <input type="email" id="qc-email" placeholder="client@example.com" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none" />
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">Address / GST Number</label>
              <input type="text" id="qc-address" placeholder="City, State, GSTIN" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none" />
            </div>

            <div class="pt-2 flex justify-end gap-2 border-t border-slate-100">
              <button type="button" id="cancel-quick-cust-btn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Cancel</button>
              <button type="submit" id="save-quick-cust-btn" class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs shadow-xs">Save & Select</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Quick Add Product Modal -->
      <div id="quick-product-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-200">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-xl bg-teal-50 text-teal-700 flex items-center justify-center font-bold">
                <i class="bi bi-box-seam-fill"></i>
              </div>
              <h3 class="font-extrabold text-slate-900 text-sm">Quick Add Product / Service</h3>
            </div>
            <button type="button" id="close-quick-prod-btn" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-xs">
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <form id="quick-product-form" class="space-y-3 text-xs">
            <div>
              <label class="block font-bold text-slate-700 mb-1">Product / Service Name <span class="text-rose-500">*</span></label>
              <input type="text" id="qp-name" required placeholder="e.g. Web Consulting or Hardware Part" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-teal-500" />
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Unit Price <span class="text-rose-500">*</span></label>
                <input type="number" step="0.01" id="qp-price" required placeholder="0.00" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs font-mono font-bold focus:outline-none" />
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1">Tax Rate (%)</label>
                <select id="qp-tax" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none">
                  <option value="0">0% (Nil)</option>
                  <option value="5">5% GST</option>
                  <option value="12">12% GST</option>
                  <option value="18" selected>18% GST</option>
                  <option value="28">28% GST</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block font-bold text-slate-700 mb-1">SKU / Code (Optional)</label>
              <input type="text" id="qp-sku" placeholder="PROD-001" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-xs focus:outline-none" />
            </div>

            <div class="pt-2 flex justify-end gap-2 border-t border-slate-100">
              <button type="button" id="cancel-quick-prod-btn" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Cancel</button>
              <button type="submit" id="save-quick-prod-btn" class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl text-xs shadow-xs">Save to Catalog</button>
            </div>
          </form>
        </div>
      </div>

    </main>
  </div>

  <script type="module">
    import { checkAuth } from '/js/auth.js';
    import { renderLayout } from '/js/layout.js';
    import { API } from '/js/api.js';
    import { formatCurrency, showToast } from '/js/utils.js';

    let catalogProducts = [];
    let currencySymbol = 'USD $';

    document.addEventListener('DOMContentLoaded', async () => {
      const auth = await checkAuth();
      if (!auth) return;

      currencySymbol = auth.business.currency || 'USD $';
      renderLayout(auth.business, auth.user);
      
      document.getElementById('quotation_date').value = new Date().toISOString().split('T')[0];

      // Load customers & catalog
      const [custRes, prodRes] = await Promise.all([
        API.get('/api/customers'),
        API.get('/api/products')
      ]);

      const custSelect = document.getElementById('customer_id');
      (custRes.data || []).forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.customer_id;
        opt.textContent = `${c.customer_name} ${c.company_name ? `(${c.company_name})` : ''}`;
        custSelect.appendChild(opt);
      });

      catalogProducts = prodRes.data || [];

      // Add initial row
      addItemRow();

      document.getElementById('add-item-btn').addEventListener('click', () => addItemRow());
      document.getElementById('overall-discount').addEventListener('input', calculateTotals);
      document.getElementById('quotation-form').addEventListener('submit', handleSubmit);

      // Setup Quick-Add Customer Modal
      const custModal = document.getElementById('quick-customer-modal');
      const openCustBtn = document.getElementById('quick-add-customer-btn');
      const closeCustBtn = document.getElementById('close-quick-cust-btn');
      const cancelCustBtn = document.getElementById('cancel-quick-cust-btn');
      const custForm = document.getElementById('quick-customer-form');

      function openCustomerModal() {
        custForm?.reset();
        custModal?.classList.remove('hidden');
        custModal?.classList.add('flex');
        document.getElementById('qc-name')?.focus();
      }
      function closeCustomerModal() {
        custModal?.classList.add('hidden');
        custModal?.classList.remove('flex');
      }

      openCustBtn?.addEventListener('click', openCustomerModal);
      closeCustBtn?.addEventListener('click', closeCustomerModal);
      cancelCustBtn?.addEventListener('click', closeCustomerModal);

      custForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('save-quick-cust-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';
        try {
          const payload = {
            customer_name: document.getElementById('qc-name').value.trim(),
            company_name: document.getElementById('qc-company').value.trim(),
            phone: document.getElementById('qc-phone').value.trim(),
            email: document.getElementById('qc-email').value.trim(),
            address: document.getElementById('qc-address').value.trim()
          };
          const res = await API.post('/api/customers', payload);
          showToast(`Customer "${payload.customer_name}" added!`, 'success');
          const newCust = res.data;
          const select = document.getElementById('customer_id');
          const opt = document.createElement('option');
          opt.value = newCust.customer_id;
          opt.textContent = `${newCust.customer_name} ${newCust.company_name ? `(${newCust.company_name})` : ''}`;
          select.appendChild(opt);
          select.value = newCust.customer_id;
          closeCustomerModal();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save & Select';
        }
      });

      // Setup Quick-Add Product Modal
      const prodModal = document.getElementById('quick-product-modal');
      const openProdBtn = document.getElementById('quick-add-product-btn');
      const closeProdBtn = document.getElementById('close-quick-prod-btn');
      const cancelProdBtn = document.getElementById('cancel-quick-prod-btn');
      const prodForm = document.getElementById('quick-product-form');

      function openProductModal() {
        prodForm?.reset();
        prodModal?.classList.remove('hidden');
        prodModal?.classList.add('flex');
        document.getElementById('qp-name')?.focus();
      }
      function closeProductModal() {
        prodModal?.classList.add('hidden');
        prodModal?.classList.remove('flex');
      }

      openProdBtn?.addEventListener('click', openProductModal);
      closeProdBtn?.addEventListener('click', closeProductModal);
      cancelProdBtn?.addEventListener('click', closeProductModal);

      prodForm?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('save-quick-prod-btn');
        submitBtn.disabled = true;
        submitBtn.textContent = 'Saving...';
        try {
          const payload = {
            name: document.getElementById('qp-name').value.trim(),
            price: document.getElementById('qp-price').value || '0',
            tax_rate: document.getElementById('qp-tax').value || '0',
            sku: document.getElementById('qp-sku').value.trim()
          };
          const res = await API.post('/api/products', payload);
          showToast(`Product "${payload.name}" saved to catalog!`, 'success');
          const newProd = res.data;
          catalogProducts.push(newProd);

          // Update all existing row selects
          document.querySelectorAll('.item-row .item-select').forEach(sel => {
            const currentVal = sel.value;
            const opt = document.createElement('option');
            opt.value = newProd.product_id;
            opt.dataset.price = newProd.price;
            opt.dataset.tax = newProd.tax_rate;
            opt.textContent = `${newProd.name} (${newProd.sku || 'No SKU'})`;
            sel.appendChild(opt);
            sel.value = currentVal;
          });

          // Set on the active/last line item
          const rows = document.querySelectorAll('.item-row');
          const lastRow = rows[rows.length - 1];
          if (lastRow) {
            const sel = lastRow.querySelector('.item-select');
            sel.value = newProd.product_id;
            lastRow.querySelector('.item-desc').value = newProd.name;
            lastRow.querySelector('.item-price').value = newProd.price || 0;
            lastRow.querySelector('.item-tax').value = newProd.tax_rate || 0;
            calculateTotals();
          }

          closeProductModal();
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Save to Catalog';
        }
      });
    });

    function addItemRow() {
      const tbody = document.getElementById('items-tbody');
      const tr = document.createElement('tr');
      tr.className = 'border-b border-slate-100 item-row';

      const options = catalogProducts.map(p => `<option value="${p.product_id}" data-price="${p.price}" data-tax="${p.tax_rate}">${p.name} (${p.sku || 'No SKU'})</option>`).join('');

      tr.innerHTML = `
        <td class="py-2 pr-2">
          <select class="w-full border border-slate-200 rounded-lg p-1.5 text-xs item-select mb-1">
            <option value="">Custom Item...</option>
            ${options}
          </select>
          <input type="text" class="w-full border border-slate-200 rounded-lg p-1.5 text-xs item-desc" placeholder="Description / Service details" />
        </td>
        <td class="py-2 px-1"><input type="number" value="1" min="1" class="w-full border border-slate-200 rounded-lg p-1.5 text-center text-xs item-qty" /></td>
        <td class="py-2 px-1"><input type="number" step="0.01" value="0.00" class="w-full border border-slate-200 rounded-lg p-1.5 text-right text-xs item-price" /></td>
        <td class="py-2 px-1"><input type="number" step="0.01" value="0" class="w-full border border-slate-200 rounded-lg p-1.5 text-right text-xs item-tax" /></td>
        <td class="py-2 pl-1 text-right font-bold text-slate-800 item-line-amount">$0.00</td>
        <td class="py-2 text-center"><button type="button" class="text-rose-500 hover:text-rose-700 remove-row-btn"><i class="bi bi-trash"></i></button></td>
      `;

      tbody.appendChild(tr);

      const selectEl = tr.querySelector('.item-select');
      selectEl.addEventListener('change', (e) => {
        const opt = e.target.selectedOptions[0];
        if (opt && opt.value) {
          tr.querySelector('.item-desc').value = opt.textContent.split('(')[0].trim();
          tr.querySelector('.item-price').value = opt.dataset.price || 0;
          tr.querySelector('.item-tax').value = opt.dataset.tax || 0;
        }
        calculateTotals();
      });

      tr.querySelectorAll('input').forEach(inp => inp.addEventListener('input', calculateTotals));
      tr.querySelector('.remove-row-btn').addEventListener('click', () => {
        tr.remove();
        calculateTotals();
      });

      calculateTotals();
    }

    function calculateTotals() {
      let subtotal = 0;
      let totalTax = 0;

      document.querySelectorAll('.item-row').forEach(row => {
        const qty = parseFloat(row.querySelector('.item-qty').value) || 0;
        const price = parseFloat(row.querySelector('.item-price').value) || 0;
        const taxRate = parseFloat(row.querySelector('.item-tax').value) || 0;

        const lineBase = qty * price;
        const lineTax = lineBase * (taxRate / 100);
        const lineTotal = lineBase + lineTax;

        subtotal += lineBase;
        totalTax += lineTax;

        row.querySelector('.item-line-amount').textContent = formatCurrency(lineTotal, currencySymbol);
      });

      const overallDiscount = parseFloat(document.getElementById('overall-discount').value) || 0;
      const grandTotal = Math.max(0, subtotal + totalTax - overallDiscount);

      document.getElementById('calc-subtotal').textContent = formatCurrency(subtotal, currencySymbol);
      document.getElementById('calc-tax').textContent = formatCurrency(totalTax, currencySymbol);
      document.getElementById('calc-total').textContent = formatCurrency(grandTotal, currencySymbol);
    }

    async function handleSubmit(e) {
      e.preventDefault();

      const items = [];
      document.querySelectorAll('.item-row').forEach(row => {
        items.push({
          product_id: row.querySelector('.item-select').value || '',
          description: row.querySelector('.item-desc').value || 'Custom Line Item',
          quantity: row.querySelector('.item-qty').value || '1',
          unit_price: row.querySelector('.item-price').value || '0',
          tax_rate: row.querySelector('.item-tax').value || '0'
        });
      });

      const payload = {
        customer_id: document.getElementById('customer_id').value,
        quotation_date: document.getElementById('quotation_date').value,
        valid_until: document.getElementById('valid_until').value,
        discount: document.getElementById('overall-discount').value || '0',
        notes: document.getElementById('notes').value,
        terms: document.getElementById('terms').value,
        items
      };

      try {
        const res = await API.post('/api/quotations', payload);
        showToast('Quotation created successfully!', 'success');
        setTimeout(() => window.location.hash = `#/quotation-view?id=${res.data.quotation_id}`, 500);
      } catch (err) {
        showToast(err.message, 'error');
      }
    }
  </script>
</body>
</html>
